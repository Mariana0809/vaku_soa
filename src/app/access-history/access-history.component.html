<!-- Lista de usuarios registrados -->
<div class="p-4">
  <h2 class="text-xl font-bold mb-4">Historial de acceso</h2>

  <table
    class="min-w-full table-auto border border-gray-300 rounded-lg overflow-hidden"
  >
    <thead class="bg-gray-100 text-gray-800 text-left">
      <tr>
        <th class="px-4 py-3 border-b">Email</th>
        <th class="px-4 py-3 border-b">Fecha de acceso</th>
        <th class="px-4 py-3 border-b">Foto</th>
        <th class="px-4 py-3 border-b">Provedor</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let access of listAccess" class="hover:bg-gray-50 transition">
        <td class="px-4 py-3 border-b text-sm text-gray-700">
          {{ access.email }}
        </td>
        <td class="px-4 py-3 border-b text-sm text-gray-600">
          {{ access.fechaAcceso?.toDate() | date : "dd/MM/yyyy - HH:mm:ss" }}
        </td>
        <td class="px-4 py-3 border-b">
          <img
            [src]="access.photoURL"
            alt="Foto"
            class="w-10 h-10 rounded-full border border-gray-300 shadow-sm"
          />
        </td>
        <td class="px-4 py-3 border-b text-sm capitalize text-gray-700">
          {{ access.provider }}
        </td>
      </tr>
    </tbody>
  </table>
</div>
